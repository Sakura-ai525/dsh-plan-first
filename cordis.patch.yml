# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# `name` must match the package name so the loader can import it from the
# profile's node_modules. `id` is the handle used to target this entry from a
# profile's own cordis.patch.yml.
#
# To switch the mode off without uninstalling, either use the toggle in the
# Harness's Plugins page, or patch this entry (id: plan-first) with:
#
#   - id: plan-first
#     config:
#       enabled: false
- insert:
    - id: plan-first
      name: 'dsh-plan-first'
      # config:
      #   enabled: false
